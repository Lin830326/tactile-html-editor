<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brightpine Holdings — Q3 2026 revenue charts</title>
<style>
  body { margin: 0; font: 16px/1.6 "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; color: #0f1f3d; background: #f4f6f8; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  figure { margin: 0 0 24px; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(15, 31, 61, .08); }
  figcaption { margin: 0 0 12px; font-weight: 700; }
  figcaption small { font-weight: 400; color: #4a5873; }
</style>
</head>
<body>
<main>
  <h1 data-fact-none="the period in the title">Brightpine Holdings: Q3 2026 revenue charts</h1>

  <figure>
    <figcaption data-fact-none="the period in the caption">Q3 2026 revenue by segment <small>USD millions</small></figcaption>
    <div data-chart="bar"
         data-chart-facts="2026Q3.xlsx/Income/D10:D13"
         data-chart-labels="2026Q3.xlsx/Income/A10:A13"
         data-chart-scale="1e-6" data-chart-digits="1"></div>
  </figure>

  <figure>
    <figcaption>Revenue by quarter <small>USD millions</small></figcaption>
    <div data-chart="line"
         data-chart-facts="2026Q3.xlsx/Quarters/B2:B6"
         data-chart-labels="2026Q3.xlsx/Quarters/A2:A6"
         data-chart-scale="1e-6" data-chart-digits="1"></div>
  </figure>

  <figure>
    <figcaption>Segment revenue, three quarters <small>USD millions</small></figcaption>
    <div data-chart="bar"
         data-chart-facts="2026Q3.xlsx/Income/B10:B13 | 2026Q3.xlsx/Income/C10:C13 | 2026Q3.xlsx/Income/D10:D13"
         data-chart-labels="2026Q3.xlsx/Income/A10:A13"
         data-chart-series="2026Q3.xlsx/Income/B9:D9"
         data-chart-scale="1e-6" data-chart-digits="0"></div>
  </figure>

  <figure>
    <figcaption data-fact-none="the period in the caption">Q3 2026 revenue mix <small>USD millions</small></figcaption>
    <div data-chart="pie"
         data-chart-facts="2026Q3.xlsx/Income/D10:D13"
         data-chart-labels="2026Q3.xlsx/Income/A10:A13"
         data-chart-scale="1e-6" data-chart-digits="1"></div>
  </figure>
</main>
</body>
</html>
