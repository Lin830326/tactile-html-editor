<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雲朵物流 第三季營收圖表</title>
<style>
  body { margin: 0; font: 16px/1.7 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: #16202b; background: #f4f6f8; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 28px; margin: 0 0 24px; }
  figure { margin: 0 0 24px; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(22, 32, 43, .08); }
  figcaption { margin: 0 0 12px; font-weight: 700; }
  figcaption small { font-weight: 400; color: #4a5a6a; }
</style>
</head>
<body>
<main>
  <h1 data-fact-none="標題的期間">雲朵物流 2026 第三季營收圖表</h1>

  <figure>
    <figcaption>第三季各服務營收 <small>百萬元</small></figcaption>
    <div data-chart="bar"
         data-chart-facts="2026Q3.xlsx/損益表/D10:D13"
         data-chart-labels="2026Q3.xlsx/損益表/A10:A13"
         data-chart-scale="1e-6" data-chart-digits="1"></div>
  </figure>

  <figure>
    <figcaption>各季營業收入合計 <small>億元</small></figcaption>
    <div data-chart="line"
         data-chart-facts="2026Q3.xlsx/損益表/B14:D14"
         data-chart-labels="2026Q3.xlsx/損益表/B9:D9"
         data-chart-scale="1e-8" data-chart-digits="2"></div>
  </figure>

  <figure>
    <figcaption>各服務的季營收 <small>百萬元</small></figcaption>
    <div data-chart="bar"
         data-chart-facts="2026Q3.xlsx/損益表/B10:B13 | 2026Q3.xlsx/損益表/C10:C13 | 2026Q3.xlsx/損益表/D10:D13"
         data-chart-labels="2026Q3.xlsx/損益表/A10:A13"
         data-chart-series="2026Q3.xlsx/損益表/B9:D9"
         data-chart-scale="1e-6" data-chart-digits="0"></div>
  </figure>

  <figure>
    <figcaption>第三季營收組成 <small>百萬元</small></figcaption>
    <div data-chart="pie"
         data-chart-facts="2026Q3.xlsx/損益表/D10:D13"
         data-chart-labels="2026Q3.xlsx/損益表/A10:A13"
         data-chart-scale="1e-6" data-chart-digits="1"></div>
  </figure>
</main>
</body>
</html>
