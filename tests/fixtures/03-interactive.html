<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合成互動頁</title>
<style>
body{margin:0;background:#f1f4f8;color:#17243a;font:16px/1.6 system-ui,sans-serif} main{max-width:860px;margin:32px auto;padding:32px;background:white} h1{margin-top:0} .interaction-panel{padding:18px;background:#edf3ff;border:1px solid #c5d4ee} button{padding:9px 14px;border:1px solid #315dcc;border-radius:4px;background:#315dcc;color:white;font:inherit;cursor:pointer} #counter-value{font-size:1.4rem;font-weight:bold} .detail{padding:12px;background:white} @media(max-width:600px){main{margin:0;padding:20px}}
</style>
</head>
<body>
<main>
<h1 id="interactive-title">合成互動頁</h1>
<p>測試腳本只修改本頁，不載入外部資源。</p>
<section id="interaction-panel" class="interaction-panel"><h2>互動測試</h2><p>計數：<output id="counter-value" aria-live="polite">0</output></p><button id="increment" type="button">增加 1</button> <button id="toggle-detail" type="button" aria-expanded="false" aria-controls="detail">顯示說明</button><p id="detail" class="detail" hidden>互動說明 C43</p></section>
<p>檢查標記：互動結尾 C43</p>
</main>
<script>
(() => {
  const value = document.getElementById('counter-value');
  const increment = document.getElementById('increment');
  const toggle = document.getElementById('toggle-detail');
  const detail = document.getElementById('detail');
  let count = 0;
  increment.addEventListener('click', () => { count += 1; value.textContent = String(count); });
  toggle.addEventListener('click', () => {
    detail.hidden = !detail.hidden;
    toggle.setAttribute('aria-expanded', String(!detail.hidden));
    toggle.textContent = detail.hidden ? '顯示說明' : '隱藏說明';
  });
})();
</script>
</body>
</html>
