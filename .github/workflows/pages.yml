name: Demo page

# Publishes dist/tactile.html as the demo at https://<owner>.github.io/<repository>/ when it changes on main.
# The file is the one in the repository: ci.yml checks that it is what build.mjs makes.

on:
  push:
    branches: [main]
    paths:
      - dist/tactile.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Put the editor at the root of the site
        run: |
          mkdir _site
          cp dist/tactile.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
